# ينشر صفحة «صديقك الذكي» على GitHub Pages تلقائيًا — فقط إذا نجحت كل الاختبارات.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# أقل صلاحيات ممكنة: قراءة الكود فقط، وصلاحية النشر لخطوة النشر وحدها
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Run tests
        run: |
          node --test --test-reporter=spec tests/*.test.mjs | tee test-output.txt
          pass=$(grep -c "^✔" test-output.txt || true); fail=$(grep -c "^✖" test-output.txt || true)
          echo "::notice::TESTS passed=$pass failed=$fail"

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css fonts icons js _site/
          # رقم النسخة في عامل الخدمة: يجعل المتصفحات تجلب التحديث
          sed -i "s/__BUILD__/${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}/" _site/sw.js
          sed -i "s/export const VERSION = '\(.*\)';/export const VERSION = '\1 (${GITHUB_RUN_NUMBER})';/" _site/js/ui/app.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
